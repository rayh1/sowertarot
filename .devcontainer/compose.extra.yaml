# Extra compose services for this project, next to `main`: a database, an object store, whatever
# the project needs. `.devcontainer/compose.yaml` pulls this file in through compose's `include`,
# so every service declared here joins the project's default network and is reachable from `main`
# by its service name; volumes and ports declared here are created like the template's own.
#
# This file is project-owned: `copier update` never overwrites it. A file with only comments is a
# valid include, so leaving it as it is costs nothing.
#
# Example: a PostgreSQL server reachable from `main` as `db`, with its data in a named volume and
# its port published on a dynamic host port. Uncomment and adjust to use it. Local development
# only: `trust` lets any client on the project network in without a credential.
#
# services:
#   db:
#     image: postgres:17
#     environment:
#       POSTGRES_HOST_AUTH_METHOD: trust
#       POSTGRES_DB: app
#     volumes:
#       - pgdata:/var/lib/postgresql/data
#     ports:
#       - "5432"
#
# volumes:
#   pgdata:
