<title>Card of the Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: card image on the left, reading on the right; stacked on phones */
:root {
  --bg: #e3e2d9;          /* bedrock grey, a touch of grass */
  --surface: #d6d4c6;
  --fg: #2b2118;          /* loam ink */
  --muted: #5d5244;
  --accent: #9a6a0c;      /* taproot gold, darkened for light ground */
  --rule: #b9b4a2;
  --display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --caps: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Spectral", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1812; --surface: #2a2119; --fg: #ece3d3; --muted: #b5a68f;
    --accent: #e8b23a; --rule: #4a3b2c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1812; --surface: #2a2119; --fg: #ece3d3; --muted: #b5a68f;
  --accent: #e8b23a; --rule: #4a3b2c; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 1.0625rem; line-height: 1.65;
  padding-inline: 16px; padding-block: 2.5rem 3rem;
}
main {
  max-width: 64rem; margin-inline: auto;
  display: grid; grid-template-columns: minmax(0, 23rem) minmax(0, 1fr);
  gap: 3rem; align-items: start;
}
figure { margin: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1.5rem); }
figure img {
  display: block; width: 100%; height: auto; border-radius: 6px;
  box-shadow: 0 1px 2px rgb(0 0 0 / .18), 0 18px 40px -18px rgb(0 0 0 / .45);
}
figcaption { margin-top: .75rem; font-size: .85rem; color: var(--muted); font-style: italic; }
.text { min-width: 0; display: flex; flex-direction: column; gap: 2rem; }
.eyebrow {
  font-family: var(--caps); letter-spacing: .08em; color: var(--muted);
  font-size: 1rem; display: flex; gap: .75rem; flex-wrap: wrap; align-items: baseline;
}
.eyebrow .pos { color: var(--accent); }
h1 {
  font-family: var(--display); font-weight: 400; font-size: clamp(2.8rem, 7vw, 4.4rem);
  line-height: 1; margin: .35rem 0 0; text-wrap: balance;
}
.lede { font-family: var(--display); font-style: italic; font-size: 1.35rem; line-height: 1.4; color: var(--muted); margin: .9rem 0 0; max-width: 34rem; }
section { border-top: 1px solid var(--rule); padding-top: 1.25rem; max-width: 38rem; }
h2 {
  font-family: var(--caps); font-weight: 400; font-size: 1.05rem; letter-spacing: .1em;
  color: var(--accent); margin: 0 0 .6rem;
}
p { margin: 0 0 .9rem; }
p:last-child { margin-bottom: 0; }
.today { background: var(--surface); border-radius: 6px; padding: 1.5rem 1.5rem 1.4rem; border-top: none; }
.today p:first-of-type { font-size: 1.15rem; }
@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); gap: 2rem; }
  figure { position: static; max-width: 22rem; margin-inline: auto; }
}
.archive h2 { margin-bottom: .4rem; }
.archive ul { list-style: none; margin: 0; padding: 0; }
.archive li { padding: .3rem 0; border-bottom: 1px dotted var(--rule); }
.archive li:last-child { border-bottom: none; }
.archive .d { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: .5rem; }
</style>

<main>
  <figure>
    $media_html
    <figcaption>Drawn at random from your $deck-card deck.</figcaption>
  </figure>

  <div class="text">
    <header>
      <div class="eyebrow"><span>$long_date</span><span class="pos">$orientation</span></div>
      <h1>$card</h1>
      <p class="lede">$lede</p>
    </header>

    <section>
      <h2>The card</h2>
$card_html
    </section>

    <section>
      <h2>Essence</h2>
$essence_html
    </section>

    <section class="today">
      <h2>For today</h2>
$today_html
    </section>

$archive_html
  </div>
</main>
